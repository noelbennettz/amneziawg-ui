services:
  app:
    image: proxy:latest
    restart: unless-stopped
    # The port mapping serves the panel and the tunnel on both stacks, but the
    # container has no IPv6 uplink on this bridge: clients get an IPv6 tunnel
    # and no IPv6 internet through it. For IPv6 egress either use
    # "network_mode: host" (drop `ports` and `sysctls`, set the sysctls on the
    # host) or give the network a routed global IPv6 prefix.
    ports:
      - "${WEB_UI_PORT:-54845}:${WEB_UI_PORT:-54845}/tcp"
      - "${DEFAULT_PORT:-54844}:${DEFAULT_PORT:-54844}/udp"
    env_file:
      - .env
    volumes:
      - data:/etc/amnezia
    cap_add:
      # The panel manages the tunnel from inside the container: iptables
      # rules, interfaces, routes. Nothing else. The userspace implementation
      # (amneziawg-go) cannot load kernel modules - it does not need one, and
      # SYS_MODULE would hand the container the ability to load any of them.
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    logging:
      options:
        max-size: 10m
        max-file: 3
volumes:
  data:
