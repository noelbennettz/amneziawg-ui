services:
  app:
    # The published image by default, so `docker compose up -d` in a fresh clone
    # pulls instead of looking for a local build. `make run` layers
    # docker-compose.build.yml on top of this file to build from source, and
    # `make deploy` sets IMAGE=proxy:latest to run the image it just shipped.
    image: ${IMAGE:-ghcr.io/noelbennettz/amneziawg-ui:latest}
    restart: unless-stopped
    # The port mapping serves the panel and the tunnel on both stacks, but the
    # container has no IPv6 uplink on this bridge: clients get an IPv6 tunnel
    # and no IPv6 internet through it, and the panel says so - nat6.state in
    # GET /api/system/iptables-test reads "ula-only". For IPv6 egress either
    # layer docker-compose.host.yml on top (network_mode: host, with the
    # forwarding sysctls set on the host) or give the network a routed global
    # IPv6 prefix.
    ports:
      - "${WEB_UI_PORT:-54845}:${WEB_UI_PORT:-54845}/tcp"
      - "${DEFAULT_PORT:-54844}:${DEFAULT_PORT:-54844}/udp"
    # Optional: `.env` is not committed (`.env.example` is). Every variable in it
    # only overrides a default the image already carries, so a clone without a
    # `.env` starts with the documented defaults. `required: false` needs
    # Compose 2.24 or newer, the same version docker-compose.host.yml needs.
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/etc/amnezia
    cap_add:
      # The panel manages the tunnel from inside the container: iptables
      # rules, interfaces, routes. Nothing else. The userspace implementation
      # (amneziawg-go) cannot load kernel modules - it does not need one, and
      # SYS_MODULE would hand the container the ability to load any of them.
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    logging:
      options:
        max-size: 10m
        max-file: 3
volumes:
  data:
