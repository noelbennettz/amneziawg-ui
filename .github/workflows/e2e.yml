name: Browser tests

# The unit job lives in docker.yml and has no pull-request trigger because that
# workflow publishes the image. The browser suite is separate so every pull
# request runs it: make e2e builds the image, starts two containers with
# NET_ADMIN and /dev/net/tun, and drives the real WebAssembly UI in Chrome.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The test containers need /dev/net/tun. GitHub's runner usually has it;
      # create it if the image does not.
      - name: Ensure /dev/net/tun exists
        run: |
          if [ ! -e /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
            sudo chmod 666 /dev/net/tun
          fi
          ls -l /dev/net/tun

      # Buildx is what the cache needs: the Dockerfile compiles the whole
      # toolchain (Go, the wasm bundle, amneziawg-go, amneziawg-tools), and
      # without a cache every pull request pays for all of it again. The cache
      # is the same GHA backend docker.yml uses, under its own scope.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The browser is the runner's Chrome, so the version is whatever the
      # image ships; the pinned half is playwright-go in e2e/go.mod, which is
      # the driver and the protocol the tests are written against. Printing
      # both makes a runner image bump visible in the log instead of only in a
      # failure.
      - name: Report the browser and driver versions
        run: |
          (google-chrome --version || chromium --version || chrome --version) || echo "no chrome on PATH"
          grep playwright-go e2e/go.mod

      - name: Run the Playwright suite
        env:
          # The layers of the test image come back from the Actions cache: the
          # Dockerfile compiles Go, the wasm bundle, amneziawg-go and
          # amneziawg-tools, which is the bulk of a cold run.
          E2E_BUILD_FLAGS: "--cache-from type=gha,scope=e2e --cache-to type=gha,mode=max,scope=e2e"
        run: |
          make e2e || {
            echo "::warning::the browser suite failed; resetting the instances and retrying once"
            make e2e-down
            make e2e
          }

      - name: Remove the test containers and volumes
        if: always()
        run: make e2e-down
