name: Build and Push Docker Image

# Runs on every push to the default branch and publishes two tags: `latest`,
# which always points at the newest commit on main, and the date the build was
# made (`2026.11.11`), which does not move again. Pinning the dated tag is how
# an upgrade becomes a decision instead of a restart. A day with several pushes
# moves that day's tag: the registry holds one version per tag, and the panel
# carries no version of its own to tell them apart.
on:
  push:
    branches:
      - main
  # Manual runs use the same pipeline; the image is tagged `latest` plus the
  # date of the build.
  workflow_dispatch:

# Two pushes racing on the same ref would both try to move `latest`; the
# newer one wins, and the older build is not worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Keep the three newest runs of *this* workflow, at the start and at the end
  # of every run. Built-in token only: no PAT, no secret and no cache key is
  # referenced. 'actions: write' is what deleting a run needs; a pull request
  # from a fork gets a read-only token, in which case scripts/prune-runs.sh
  # only warns and the job stays green.
  prune-runs-before:
    name: Keep the three newest runs (before)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep the newest three runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-runs.sh 3

  # Nothing is published that has not passed the tests. The panel is a network
  # service and `latest` is what people pull: a commit that fails `go test` must
  # not become the newest image.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test the server
        run: |
          go vet ./...
          go test ./...

      - name: Vet the frontend
        run: |
          cd web-ui
          GOOS=js GOARCH=wasm go vet ./...
          GOOS=js GOARCH=wasm go build ./...

      # The frontend's unit tests run the wasm binary through node. The
      # runner has one; a fork or a self-hosted runner may not, and a missing
      # interpreter is not a failing test.
      #
      # The exec wrapper is named explicitly rather than left to the go
      # command's own lookup: `go test` for js/wasm has to be told what to run
      # the .test file with, and where it looks for that has moved between Go
      # releases. The module root is left out on purpose - it is the fyne app
      # itself, and importing it pulls in the glfw wasm driver, whose init
      # reads `window`, which node does not have: the binary panics before a
      # single test runs. Everything under api/ and internal/ runs there.
      - name: Test the frontend
        run: |
          cd web-ui
          if command -v node >/dev/null 2>&1; then
            GOOS=js GOARCH=wasm go test \
              -exec "node $(go env GOROOT)/lib/wasm/wasm_exec_node.js" \
              ./api/... ./internal/...
          else
            echo "::warning::node is not on PATH - the wasm unit tests did not run"
          fi

      - name: Vet the end-to-end suite
        run: cd e2e && go vet ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to GitHub Packages with the built-in token: no secret to set up.
      packages: write
      # Cosign signs keylessly: it exchanges this token for a short-lived
      # certificate from Fulcio, so there is no long-lived signing key in the
      # repository and nothing to leak. The signature is recorded in the public
      # transparency log (Rekor) under this workflow's identity.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR rejects an image reference with uppercase letters, and a GitHub
      # owner or repository name may have them. Lowercase it once here rather
      # than expecting every repository name to be spelled in lowercase.
      - name: Compute the image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The build's identity, from the checkout that is being built: the tag
      # (or the short commit when there is none), the commit, and now. They go
      # into the binary through the linker - /api/version answers with them -
      # and onto the image as labels, so a container can say which build it is
      # without a login.
      - name: Compute the build identity
        run: |
          {
            echo "VERSION=$(git describe --tags --always)"
            echo "COMMIT=$(git rev-parse --short=8 HEAD)"
            echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      # Every compiler in the Dockerfile cross-compiles, so QEMU is only ever
      # asked to run apk and busybox while the final arm64 layer is assembled.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY.MM.DD'}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The Dockerfile owns the labels, because it is also what puts the
          # same three values into the binary: metadata-action's set would
          # replace them with its own (version=latest, title from the
          # repository name), and then the image and /api/version would
          # disagree about which build they are.
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Supply chain: signature, SBOM, attestation ───────────────────────
      # The image is signed by digest, not by tag: a tag moves, a digest does
      # not. Both tools are pinned - the action by commit, cosign and syft by
      # release - so a new upstream release cannot change what is published
      # under this workflow.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the pushed image (keyless)
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          echo "signing ${IMAGE}"
          cosign sign --yes "${IMAGE}"

      # syft reads the pushed image out of the registry - both the Alpine
      # packages and the Go modules the two binaries and the wasm bundle are
      # built from. The SPDX document is attached to the run as an artifact and
      # to the image as an attestation, so a consumer can check what is in the
      # thing they pulled without trusting this repository's prose.
      - name: Generate the SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: amneziawg-ui.spdx.json
          syft-version: v1.57.2
          dependency-snapshot: false

      - name: Attest the SBOM against the image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}"

      - name: Write the verification instructions into the run summary
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Image ${IMAGE}"
            echo
            echo "Signed keylessly by this workflow; the SPDX SBOM is attached as"
            echo "\`amneziawg-ui.spdx.json\` and as an attestation."
            echo
            echo '```sh'
            echo "cosign verify \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/${REPO}/.github/workflows/docker.yml@refs/heads/main \\"
            echo "  ${IMAGE}"
            echo
            echo "cosign verify-attestation --type spdxjson \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/${REPO}/.github/workflows/docker.yml@refs/heads/main \\"
            echo "  ${IMAGE} | jq -r '.payload' | base64 -d | jq .predicate"
            echo '```'
            echo
            echo "The commit this build was made from is \`${SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # The size of the image is one of the numbers the project is sold on, so
      # it gets reported on every build instead of being remembered. It is a
      # warning and not a gate: a release should not fail because a layer grew,
      # and the number is only worth acting on when a human looks at what
      # changed. The sum is of the compressed layers the registry holds, which
      # is what `docker pull` reports - not the unpacked size on disk.
      - name: Report the image size
        continue-on-error: true
        run: |
          ref="${IMAGE_NAME}:latest"
          largest=0
          for digest in $(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
              | python3 -c 'import json,sys;print(" ".join(m["digest"] for m in json.load(sys.stdin).get("manifests",[])))'); do
            size=$(docker buildx imagetools inspect "${ref}@${digest}" --format '{{json .Manifest}}' \
              | python3 -c 'import json,sys;print(sum(l.get("size",0) for l in json.load(sys.stdin).get("layers",[])))')
            echo "  ${digest}: $((size / 1000000)) MB"
            if [ "$size" -gt "$largest" ]; then largest=$size; fi
          done
          echo "Largest platform: $((largest / 1000000)) MB compressed"
          if [ "$largest" -gt 40000000 ]; then
            echo "::warning::the image is $((largest / 1000000)) MB compressed, over the 40 MB line"
          fi

      - name: Verify pushed image
        run: |
          echo "Image successfully pushed to ${{ env.REGISTRY }}"
          echo "Platforms: ${{ env.PLATFORMS }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo
          echo "The package is public; no docker login is needed to pull it."

  # The end of the run: 'always()' keeps this last in every outcome (failed
  # tests, a failed build, a cancelled release), so the three-newest rule is
  # enforced on the way out too.
  prune-runs-after:
    name: Keep the three newest runs (after)
    needs: [test, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep the newest three runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-runs.sh 3
