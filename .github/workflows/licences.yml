name: Licences

# Checks the licence of every Go dependency the panel and its frontend are built
# from. scripts/check-licences.sh runs go-licenses with a strict allowlist -
# Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT - and then audits the one
# exception by name and version: fyne.io/fyne/v2 pulls in
# github.com/go-text/{render,typesetting}, which are Unlicense (public-domain
# dedications, OSI-approved and GPL-compatible). Unlicense is not on the
# allowlist: those two modules are ignored by the strict check and matched
# against the pair the script names, so a third Unlicense package - or either of
# these at another version - fails. THIRD_PARTY_NOTICES.md records the reason.
#
# go-licenses is pinned to an exact released version - v2.0.1, published
# 2025-09-08 - so a new release cannot change the answer under the project's
# feet. It is installed with "go install", not through an action, so nothing
# third-party is trusted beyond the Go module proxy itself.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_LICENSES_VERSION: v2.0.1

jobs:
  go-licenses:
    name: Every Go dependency is on the allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install go-licenses
        run: go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"

      # The script covers both modules (the server's and the frontend's, which
      # is compiled into the WebAssembly bundle and therefore ships too), the
      # strict allowlist, the Unlicense exception and the inventory.
      - name: Check every module
        run: scripts/check-licences.sh
