name: Workflow lint

# actionlint reads the workflows the way GitHub does and checks them with
# shellcheck: an expression that cannot resolve, a job whose permission is
# missing, a `run:` script with a quoting bug. Those are the failures that
# otherwise only show up as a red run after a merge, which is the worst moment
# to find them.
#
# The project's rule is that a check has to be runnable locally by a
# contributor, so this is the same binary `actionlint` on PATH, installed from
# its module at an exact version rather than through an action: nothing
# third-party is trusted beyond the Go module proxy.
#
# shellcheck comes with the runner image; when it is missing actionlint simply
# skips those checks, which is why the version is printed first.
on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: v1.7.12

jobs:
  # Keep the three newest runs of *this* workflow, at the start and at the end
  # of every run. Built-in token only: no PAT, no secret and no cache key is
  # referenced. 'actions: write' is what deleting a run needs; a pull request
  # from a fork gets a read-only token, in which case scripts/prune-runs.sh
  # only warns and the job stays green.
  prune-runs-before:
    name: Keep the three newest runs (before)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep the newest three runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-runs.sh 3

  actionlint:
    name: Every workflow parses and passes shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Lint the workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" --version
          "$(go env GOPATH)/bin/actionlint"

  # The end of the run: 'always()' runs this after the job above whatever its
  # outcome, so the three-newest rule holds for a red pull request as well.
  prune-runs-after:
    name: Keep the three newest runs (after)
    needs: [actionlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep the newest three runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-runs.sh 3
