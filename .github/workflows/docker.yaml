name: Build and Push Docker Image

# Runs on every push to the default branch and publishes one tag, `latest`.
# One tag means one thing to pull and one package version to keep: a release
# does not upload a second copy of the same build under a version number, and
# `docker pull ...:latest` is always the newest commit on main. Version tags
# (`v*.*.*`) deliberately do not trigger a build.
on:
  push:
    branches:
      - main

# Two pushes racing on the same ref would both try to move `latest`; the
# newer one wins, and the older build is not worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to GitHub Packages with the built-in token: no secret to set up.
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR rejects an image reference with uppercase letters, and a GitHub
      # owner or repository name may have them. Lowercase it once here rather
      # than expecting every repository name to be spelled in lowercase.
      - name: Compute the image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Every compiler in the Dockerfile cross-compiles, so QEMU is only ever
      # asked to run apk and busybox while the final arm64 layer is assembled.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # A single tag, replaced in place by every build. Semver tags and a
          # per-branch tag would each leave their own version behind in the
          # package, which is the storage this workflow is meant to keep small:
          # the registry holds exactly one version, the current build of main.
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          echo "Image successfully pushed to ${{ env.REGISTRY }}"
          echo "Platforms: ${{ env.PLATFORMS }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo
          echo "The package is private until you change its visibility at"
          echo "https://github.com/users/${{ github.repository_owner }}/packages/container/${GITHUB_REPOSITORY#*/}/settings"
          echo "A private package needs 'docker login ghcr.io' on the host that pulls it."
